<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      <div class="container">

              />

              <div class="linha-dupla
                <input type="number" id="numeroCarteirinha" name="matricula" required placeholder="Nº CPF" />

                <input type="date" id="data" name="Consulta" class="dtVencimento" required placeholder="data de vencimento" />
                 <select name="Hora" id="hora" required>
                  <option value="">Hora</option>
                  <option value="08:00">08:00</option>
                  <option value="09:00">09:00</option>
                  <option value="10:00">10:00</option>
                  <option value="11:00">11:00</option>

                  <option value="18:00">18:00</option>
                   <option value="18:00">19:00</option>
                    <option value="18:00">20:00</option>
                      <option value="18:00">21:00</option>
                      <option value="18:00">22:00</option>
                         <option value="18:00">23:00</option>
                </select>
=======
                <input
                  type="text"
                  id="numeroCarteirinha"
                  name="matricula"
                  required
                  placeholder="Nº Da Carteirinha"
                />

                <input
                  type="date"
                  id="data"
                  name="Datas"
                  class="dtVencimento"
                  required
                  placeholder="data de vencimento"
    
              </div>
              <div class="linha-dupla">
                <input
                  type="hidden"
                  name="Data_do_Acesso"
                  value="x-sheetmonkey-current-date-time"
                />

                <input
                  type="tel"
                  id="telefone"
                  name="Telefones"
                  required
                  placeholder="DDD+WhatsApp "
                />

                <button type="submit" class="btnEnviar" id="botaoEnviar">
                  Enviar
                </button>
              </div>
              <button type="submit" class="btnEnviar700px">Enviar</button>
            </form>
            <div id="alertaSucesso" class="alerta-sucesso">
              ✅ Formulário enviado com sucesso!
            </div>
          </div>
        </div>
        <div class="box-blue">
          <img src="./assets/logo_branca 2.svg" alt="" />
        </div>
      </div>
    </main>

    <script src="scripts.js"></script>

</html>
